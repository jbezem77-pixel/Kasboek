<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://api.anthropic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Kasboek VS AM</title>
<meta name="description" content="Facturen, kosten, uren en btw. Je gegevens blijven op je telefoon.">
<meta name="theme-color" content="#0E6B57">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<style>
/* Layout: zijbalk-navigatie op desktop, tabbalk onderaan op telefoon; werkvlak met registers en formulieren in een paneel */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E8ECE7; --line:#D6DCD4;
  --ink:#18201C; --muted:#5D6A62; --accent:#0E6B57; --accent-ink:#FFFFFF; --accent-soft:#D7EBE4;
  --ok:#1F7A3F; --ok-soft:#DDF0E2; --warn:#9A5B00; --warn-soft:#FBEBD0; --bad:#B3261E; --bad-soft:#F8DCD9;
  --paper:#FFFFFF; --paper-ink:#222222; --paper-muted:#666666; --paper-band:#2B2B2B;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201B; --sunk:#0C100E; --line:#2B3530;
  --ink:#E6ECE8; --muted:#97A59C; --accent:#4CC2A3; --accent-ink:#06261E; --accent-soft:#163A30;
  --ok:#6FD08F; --ok-soft:#173623; --warn:#F0B35A; --warn-soft:#3A2A10; --bad:#FF8A80; --bad-soft:#3D1715;
  --paper:#FFFFFF; --paper-ink:#222222; --paper-muted:#666666; --paper-band:#2B2B2B;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201B; --sunk:#0C100E; --line:#2B3530;
  --ink:#E6ECE8; --muted:#97A59C; --accent:#4CC2A3; --accent-ink:#06261E; --accent-soft:#163A30;
  --ok:#6FD08F; --ok-soft:#173623; --warn:#F0B35A; --warn-soft:#3A2A10; --bad:#FF8A80; --bad-soft:#3D1715;
  --paper:#FFFFFF; --paper-ink:#222222; --paper-muted:#666666; --paper-band:#2B2B2B;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.65rem} h2{font-size:1.2rem} h3{font-size:1rem}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;margin-bottom:20px}
.brand b{font-family:var(--f-display);font-size:1.3rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .grp{margin:14px 10px 4px}
.nav button:focus-visible{outline:2px solid var(--accent)}
.main{min-width:0;padding-block:24px 96px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabbar{display:none}

.btn{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 10px;font-size:.85rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>.pb{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-family:var(--f-mono);font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums}
.kpi.lead{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.lead .label{color:inherit;opacity:.8}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
tfoot td{font-weight:600;border-bottom:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:.8rem;color:var(--muted);font-weight:500}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:90px;resize:vertical}
.calc{background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem}

.sheet-bg{position:fixed;inset:0;background:rgba(10,16,13,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding-block:max(24px, env(safe-area-inset-top,0px)) 24px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));overflow:auto}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:620px;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.25)}
.sheet>.sh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);gap:8px}
.sheet>.sb{padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet>.sf{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet>.sf .left{margin-right:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:80;font-size:.9rem;max-width:calc(100% - 32px)}

/* factuur-editor */
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,3fr) 80px 92px 100px 92px 104px 32px;gap:8px;align-items:center}
.line .tot{text-align:right;font-family:var(--f-mono);font-size:.9rem}
.line.headl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.totals{display:grid;grid-template-columns:auto auto;gap:4px 24px;justify-content:end;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.totals .big{font-family:var(--f-display);font-size:1.3rem;font-weight:700}
.x{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.x:hover{background:var(--sunk);color:var(--bad)}

/* papieren factuur (preview) */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 30px rgba(0,0,0,.08);padding:40px 44px;font-family:"Nunito Sans","Segoe UI",system-ui,sans-serif;font-size:13px;max-width:800px;width:100%;margin:0 auto}
.paper .top{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.paper h4{font-size:26px;margin:0 0 18px;text-align:right;font-family:inherit}
.paper .meta{display:grid;grid-template-columns:auto auto;gap:6px 30px;font-size:12px}
.paper .meta b{font-weight:700}
.paper .meta span{text-align:right}
.paper table{margin-top:28px}
.paper th{background:var(--paper-band);color:#fff;text-transform:none;letter-spacing:0;font-size:12px}
.paper td{border-bottom:1px solid #eee;color:var(--paper-ink)}
.paper .pt{display:grid;grid-template-columns:auto auto;gap:6px 30px;justify-content:end;margin-top:12px;font-size:12px}
.paper .pt .big{font-size:20px;font-weight:700}
.paper .muted{color:var(--paper-muted)}

.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .grid{stroke:var(--line)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--sunk);display:grid;place-items:center;font-size:.65rem;color:var(--muted);border:1px solid var(--line)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--sunk)}
.notice{border-radius:9px;padding:12px 14px;background:var(--accent-soft);color:var(--ink);font-size:.9rem}
.notice.warn{background:var(--warn-soft)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.mcards{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);opacity:0}
label.btn{user-select:none}
.txrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--line)}
.txrow:last-child{border-bottom:0}
.txrow .amt{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.txrow .acts{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px}
.amt.plus{color:var(--ok)}
.ph-hint{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.sw{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.toggle{position:relative;flex-shrink:0;width:46px;height:26px}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .15s}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span::after{transform:translateX(20px)}
.toggle input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.calcrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;font-variant-numeric:tabular-nums}
.calcrow .num{text-align:right}
.calcrow .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
@media (prefers-reduced-motion: reduce){.toggle span,.toggle span::after{transition:none}}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-size:.7rem;color:var(--muted)}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
  .line{grid-template-columns:1fr 1fr 1fr;padding:10px;border:1px solid var(--line);border-radius:9px}
  .line .desc{grid-column:1/-1}
  .line.headl{display:none}
  .line .tot{grid-column:1/3;text-align:left}
  .form{grid-template-columns:1fr}
  .paper{padding:22px 18px}
  .hide-m{display:none}
  .mcards{display:flex;flex-direction:column}
  .mcards .mc{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .mcards .mc:last-child{border-bottom:0}
  .mcards .mc>div{min-width:0;display:flex;flex-direction:column;gap:3px}
  .mcards .mc>div:last-child{align-items:flex-end;flex-shrink:0}
  .tbl-wrap.has-m{display:none}
}
</style>

<div class="app" id="app">
  <aside class="side" aria-label="Navigatie">
    <div class="brand"><b>Kasboek</b><span class="small muted" id="brandName">Boekhouding zzp</span></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main"><div class="wrap" id="view"><div class="empty"><span class="spin"></span>Administratie laden…</div></div></main>
  <nav class="tabbar" id="tabbar" aria-label="Navigatie"></nav>
</div>
<div id="modal"></div>
<input type="file" id="importIn" class="sr" accept="application/json,.json" aria-label="Back-up kiezen">

<script src="runtime.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
